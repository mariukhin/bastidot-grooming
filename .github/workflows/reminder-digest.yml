name: Дайджест сплячих клієнтів

on:
  schedule:
    # Кілька спроб замість однієї: планувальник GitHub регулярно затримує
    # запуски на десятки хвилин, надто на початку години. Хвилина 17 обрана
    # свідомо — там менше черга. Сам скрипт вирішує, чи вже час і чи не
    # надсилали сьогодні, тож зайві спроби нічого не роблять.
    - cron: '17 8 * * *'
    - cron: '17 9 * * *'
    - cron: '17 10 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Лише показати повідомлення, нічого не надсилати'
        type: boolean
        default: true

# Дві спроби не мають виконуватись одночасно.
concurrency:
  group: reminder-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Встановити залежності
        working-directory: backend-node
        run: npm ci --omit=dev

      - name: Надіслати дайджест
        working-directory: backend-node
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REMINDER_INACTIVE_DAYS: ${{ vars.REMINDER_INACTIVE_DAYS }}
          REMINDER_COOLDOWN_DAYS: ${{ vars.REMINDER_COOLDOWN_DAYS }}
          REMINDER_BATCH_SIZE: ${{ vars.REMINDER_BATCH_SIZE }}
          REMINDER_RUN_AT: ${{ vars.REMINDER_RUN_AT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node --experimental-strip-types src/features/reminder/run.ts --scheduled
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node --experimental-strip-types src/features/reminder/run.ts --dry-run
          else
            node --experimental-strip-types src/features/reminder/run.ts
          fi

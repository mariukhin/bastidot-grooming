app = 'bastidot-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  PORT = '8000'
  CONTEXT_TIMEOUT = '2'
  CORS_ORIGINS = 'https://bastidot-grooming.vercel.app'
  ACCESS_TOKEN_EXPIRY_HOUR = '2'
  REFRESH_TOKEN_EXPIRY_HOUR = '168'
  REMINDER_INACTIVE_DAYS = '60'
  REMINDER_COOLDOWN_DAYS = '30'
  REMINDER_WARM_COUNT = '6'
  REMINDER_COLD_COUNT = '2'
  REMINDER_NOANSWER_COUNT = '2'
  REMINDER_RUN_AT = '11:00'
  REMINDER_TIME_ZONE = 'Europe/Kyiv'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  timeout = '5s'
  method = 'GET'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
